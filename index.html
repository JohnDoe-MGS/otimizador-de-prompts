<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Otimizador Imperativo de Prompts</title>

  <!-- SEO / Social -->
  <meta name="description" content="Transforme rascunhos caóticos em prompts imperativos estruturados em 4 quadrantes (Escopo, Diretrizes, Formatação, Restrições) — com recomendações de modelo, temperatura e top-p para LLMs." />
  <meta name="author" content="Otimizador Imperativo de Prompts" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fafafa" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Otimizador Imperativo de Prompts" />
  <meta property="og:description" content="Meta-prompting estruturado em 4 quadrantes, com parâmetros recomendados de LLM. 100% client-side, sem login." />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary" />

  <!-- Favicon (SVG inline, sem requisição extra) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'%3E%3Cpath d='M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- App: bundle pré-compilado e autocontido (React + lucide embutidos, sem CDN em runtime).
       Gerado por `npm run build` a partir de src/app.jsx. -->
  <script defer src="assets/app.js"></script>

  <style>
    :root { color-scheme: light dark; font-size: 17px; }
    @media (max-width: 480px) { :root { font-size: 16px; } }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0; padding: 0; background: #fafafa;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <noscript>Este app requer JavaScript habilitado.</noscript>
</body>
</html>
